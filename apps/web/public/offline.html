<!DOCTYPE html>
<html lang="en" style="background-color: #FDFDFD; color-scheme: light;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FDFDFD" />
  <title>Offline | TTRC Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FDFDFD;
      color: #050507;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #050507;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #6D6A6A;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #844AFB;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #6721F2;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/pwa-icon-192.png" alt="TTRC Store" class="logo" />
    <h1>You are currently offline</h1>
    <p>Please check your internet connection to continue browsing robotics kits, components, and electronics on TTRC Store.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
